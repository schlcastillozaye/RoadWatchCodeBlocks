<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="RoadWatch — road issue reporting and maintenance management platform by Code Blocks Inc." />
  <title>RoadWatch · Code Blocks Inc.</title>
  <link rel="icon" type="image/png" href="/brand/logo-dark.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=League+Spartan:wght@400..900&family=Poppins:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="/vendor/leaflet.css" />
  <link rel="stylesheet" href="/css/styles.css" />
</head>
<body>
  <div id="root"></div>
  <!-- Absolute paths so client-side routes (/login, /admin, /reports/…) still
       find these assets when the page is loaded or reloaded on a deep link. -->
  <script src="/vendor/leaflet.js"></script>
  <script src="/config.js"></script>
  <!-- Regenerated in the container from RW_API_BASE_URL (see docker-entrypoint.d)
       and loaded *before* js/app.js so the API origin is set when it is consumed.
       The ?v= is a one-off cache-buster: older deployments cached this file for
       an hour, which is why a corrected RW_API_BASE_URL could appear ignored. -->
  <script src="/rw-runtime-config.js?v=2"></script>
  <script src="/js/app.js"></script>
</body>
</html>
