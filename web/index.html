<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="RoadBlocks — road issue reporting and maintenance management platform by Code Blocks Inc." />
  <title>RoadBlocks · Code Blocks Inc.</title>
  <link rel="icon" type="image/png" href="/brand/logo-dark.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta id="rw-theme-color" name="theme-color" content="#eaf0fa" />
  <script>
    (function () {
      try {
        var savedTheme = localStorage.getItem('roadwatch_theme');
        var theme = savedTheme === 'light' || savedTheme === 'dark'
          ? savedTheme
          : (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        document.documentElement.dataset.theme = theme;
        document.getElementById('rw-theme-color').content = theme === 'dark' ? '#0b1729' : '#eaf0fa';
      } catch (error) {
        var systemTheme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        document.documentElement.dataset.theme = systemTheme;
        document.getElementById('rw-theme-color').content = systemTheme === 'dark' ? '#0b1729' : '#eaf0fa';
      }
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=League+Spartan:wght@400..900&family=Poppins:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="/vendor/leaflet.css" />
  <link rel="stylesheet" href="/css/styles.css" />
</head>
<body>
  <div id="root">
    <main class="rw-landing rw-landing-boot" aria-labelledby="rw-landing-boot-title">
      <div class="rw-landing-container">
        <section class="rw-landing-hero">
          <div class="rw-landing-hero-copy">
            <p class="rw-landing-eyebrow">ROADWATCH · ROAD ISSUE REPORTING</p>
            <h1 id="rw-landing-boot-title">Better roads start with a clear report.</h1>
            <p class="rw-landing-lede">RoadWatch helps residents report road concerns with a location and photo, while giving maintenance teams a clear way to review and track the work.</p>
            <div class="rw-landing-hero-actions">
              <a href="/register" class="rw-landing-button rw-landing-button-primary">Create a citizen account</a>
              <a href="/login" class="rw-landing-button rw-landing-button-secondary">Sign in</a>
            </div>
          </div>
        </section>
      </div>
    </main>
  </div>
  <!-- Absolute paths so client-side routes (/login, /admin, /reports/…) still
       find these assets when the page is loaded or reloaded on a deep link. -->
  <script src="/vendor/leaflet.js"></script>
  <script src="/config.js"></script>
  <!-- Regenerated in the container from RW_API_BASE_URL (see docker-entrypoint.d)
       and loaded *before* js/app.js so the API origin is set when it is consumed.
       The ?v= is a one-off cache-buster: older deployments cached this file for
       an hour, which is why a corrected RW_API_BASE_URL could appear ignored. -->
  <script src="/rw-runtime-config.js?v=2"></script>
  <script src="/js/app.js"></script>
</body>
</html>
