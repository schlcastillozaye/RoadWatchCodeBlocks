; ---------------------------------------------------------------------------
;  RoadWatch API — PHP upload limits (loaded via /usr/local/etc/php/conf.d).
;
;  The application enforces its own limit: MAX_UPLOAD_BYTES (default 8 MB) is
;  checked in ReportService::storeBuffers(), which returns a clear
;  413 UPLOAD_LIMIT_FILE_SIZE response. These PHP-level limits must stay ABOVE
;  that value: if PHP rejected the body first, the request would arrive with no
;  files at all and the client would see a misleading "at least one photo is
;  required" error.
;
;  Keep post_max_size >= upload_max_filesize + form overhead.
; ---------------------------------------------------------------------------
upload_max_filesize = 12M
post_max_size = 70M
max_file_uploads = 20
